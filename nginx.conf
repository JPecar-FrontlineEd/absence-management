map $http_host $redirect_host {
    "localhost.fldev.net:3000"  "localhost.fldev.net:4000";
    "adminweb-qa.flqa.net"      "adminwebreact-qa.flqa.net";
    default                     $http_host;  # unknown host: no-op until mapped
}

server {
    listen 80;
    server_name  aesop_frontend;

    location / {
        return 302 $scheme://$redirect_host$request_uri;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
        add_header Pragma "no-cache";
        add_header Expires "0"; 
    }
}
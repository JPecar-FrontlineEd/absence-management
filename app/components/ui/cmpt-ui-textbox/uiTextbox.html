<div class="cmpt-ui-textbox">
	<input aria-label="{{label}}" class="fl-input" placeholder='{{ placeholder }}' ng-model="vm.fieldValue" maxlength="{{maxLength}}" ng-show="!readOnly" ng-disabled="!enabled" ng-class="{'error': errorMessages.length > 0 && !hideErrorMessage}"></input>
	<div ng-show="readOnly">{{ valueText }}</div>
	<div ng-if = "!hideErrorMessage" class="error-message" ng-repeat="value in errorMessages">
		{{ value }}
	</div>
</div>

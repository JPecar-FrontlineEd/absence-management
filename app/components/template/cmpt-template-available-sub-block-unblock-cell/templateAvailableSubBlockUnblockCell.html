<div class="cmpt-template-available-sub-block-unblock-cell">
	<div class="block-unblock">
		<i class="{{ vm.cssClass }}"></i>
		<a class="fl-button" ng-click="go.onClick()" ng-class="{'fl-disabled': vm.onAbsence}">

				{{ vm.text }}
			</span>
		</a>
	</div>
</div>

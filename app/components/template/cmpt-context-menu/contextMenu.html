<div class="cmpt-context-menu">
    <ul class="contextMenuBackground">
        <label class="contextMenuHeader">{{linkText}}</label>
        <li ng-repeat = "menuItem in contextMenuData" class="padding2">
            <a class="link" href="{{menuItem.URL}}">{{menuItem.text}}</a>
        </li>
    </ul>
</div>

<div class="cmpt-absr-notes-and-attachments">
    <div class="section-header">
        <span>{{strings['NotesAndAttachments']}}</span>
    </div>
    <div class="element" ng-if="absrState.context.showNotesToAdmin">
        <label>{{ strings['NotesToAdmin'] }}</label>
        <span>{{ absrState.administratorNotes || 'None' }}</span>
    </div>
    <div class="element" ng-if="absrState.needSub">
        <label ng-show="absrState.context.showNotesToAdmin">{{ strings['NotesToSub'] }}</label>
        <label ng-show="!absrState.context.showNotesToAdmin">{{ strings['Notes'] }}</label>
        <span>{{ absrState.substituteNotes || 'None' }}</span>
    </div>
    <div class="element" ng-if="absrState.context.showNotesToAdminOnly">
        <label>{{strings['NotesToAdminOnly']}}</label>
        <span>{{ absrState.adminOnlyNotes || 'None' }}</span>
    </div>
    <div class="element file-section" ng-if="vm.files.length > 0">
        <div class="label">
            <label>{{strings['Attachments']}}</label>
        </div>
        <div class="files">
            <div class="item" ng-repeat="file in vm.files">
                <span class="file-attachment">
                    <a target="_self" class="file fa {{ file.icon }}-before" ng-if="file.id > 0"
                        title="{{ file.fileName }}" href="{{go.downloadLink(file)}}">{{ file.fileName }}</a>
                    <div title="{{ file.fileName }}" class="file fa {{ file.icon }}-before" ng-if="file.id === 0">
                        {{ file.fileName }}</div>
                </span>
                <span class="caption">
                    <span ng-hide="file.editing">{{ file.description }}</span>
                </span>
            </div>
        </div>
    </div>
</div>

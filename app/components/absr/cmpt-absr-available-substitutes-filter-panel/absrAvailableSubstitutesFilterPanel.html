<div class="cmpt-absr-available-substitutes-filter-panel">
	<div class="search-box inset-panel" ng-if="vm.showLeadTimeMsg">
		<div>
			<i class="fa fa-info-circle" aria-hidden="true"></i>
			<span>{{vm.leadTimeMsg}}</span>
		</div>
	</div>
	<div class="search-box inset-panel">
		<div class="label">
			<label for="{{strings['SearchSubstitute']}}">{{ strings['AvailableSub.Text.SearchForSubstitute'] }}:</label></div>
		<div>
			<div class="fl-search">
				<i class="fa fa-search"></i>
				<input id="{{strings['SearchSubstitute']}}" class="fl-input" type="text" ng-model="filter" placeholder="{{ strings['AvailableSub.Text.LastName'] }}" />
			</div>
			<label>
            	<input type="checkbox" ng-model="showQualified"/>
            	<span>{{ strings['AvailabeSub.Text.OnlyShowQualifiedAndAvailableSubstitutes'] }}</span>
            </label>
        </div>
	</div>

</div>

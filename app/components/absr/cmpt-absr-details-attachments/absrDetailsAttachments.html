<div class="cmpt-absr-details-attachments">
	<div class="attachments-header">
		<label>{{ strings['Attachments'] }}</label>
	</div>
	<div class="upload-component">
		<cmpt-ui-file-upload files="absrState.uploadedFiles" enabled="true" ng-if="vm.editable.attachment"></cmpt-ui-file-upload>
	</div>
	<div class="-g">
		<div class="-u-12-24 uploaded-files">
			<label>{{ strings['UploadedFiles'] }}</label>
			<div class="-g item" ng-repeat="file in absrState.uploadedFiles">
				<div class="-u-17-24">
				 	<div class="file-attachment">
				 		<a target="_self" class="file fa {{ file.icon }}-before" ng-if="file.id > 0" title="{{ file.fileName }}" href="{{go.downloadLink(file)}}">{{ file.fileName }}</a>
				 		<div title="{{ file.fileName }}" class="file fa {{ file.icon }}-before" ng-if="file.id === 0">{{ file.fileName }}</div>
			 		</div>
				 	<div class="caption">
				 		<input type="text" ng-model="file.description" ap-focus-bind="file.editing" ng-show="file.editing" placeholder="Enter file description">
				 		<div ng-hide="file.editing">{{ file.description }}</div>
			 		</div>
				</div>
				<div class="-u-7-24 actions" ng-if="vm.editable.attachment">
					<a class="fl-button-sm fa fa-pencil" ng-click="file.editing = true"></a>
					<a class="fl-button-sm fa fa-trash-o" ng-click="go.deleteFile($index)"></a>
				</div>
			</div>
			<div class="no-files" ng-if="!absrState.uploadedFiles.length">
				No Uploaded Files
			</div>
		</div>
		<div class="-u-12-24 related-files">
			<label>{{ strings['RelatedFiles'] }}</label>
			<div class="item" ng-repeat="file in filteredFileList=(absrState.relatedFiles | instRelatedFiles : absrState.absrInstIds)">
				<div class="file-attachment">
				 	<a target="_blank" title="{{ file.fileName }}" class="file fa {{ file.icon }}-before" href="{{go.downloadLink(file)}}">{{file.fileName}}</a>
				</div>
				<div class="caption">{{ file.description }}</div>
			</div>
			<div class="no-files" ng-if="!filteredFileList.length">
				No Related Files
			</div>
		</div>
	</div>
</div>

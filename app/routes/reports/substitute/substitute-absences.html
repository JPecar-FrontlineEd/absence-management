<div class="fixed-width report-standards route-reports-substitute-substitute-absences" ng-controller="SubstituteAbsencesCtrl as route">
	<cmpt-reports-switcher section="substitute"></cmpt-reports-switcher>

	<h3>{{route.strings['Reports.Title.SubstituteAbsence']}}</h3>

	<div class="panel">
		<cmpt-reports-filter-panel filters="route.vm.filters" extra-validators="route.vm.validation" action="route.go.callToServer"></cmpt-reports-filter-panel>
	</div>

	<div id="report-lock-header" class="lock-header-fill"></div>

	<div class="header">
		<div class="header-content">
			<div class="count" ng-class="{loaded: route.vm.dataLoaded}">{{route.vm.dataSet.length}}</div>
			<div class="label" ng-class="{loaded: route.vm.dataLoaded}">{{route.strings['Reports.Title.SubstituteAbsence']}}</div>
			<cmpt-ui-loader cls="report-loader" is-loading="route.vm.isLoading"></cmpt-ui-loader>
			<cmpt-ui-print-button></cmpt-ui-print-button>
		</div>
	</div>

	<div class="content-panel" ng-class="{loaded: route.vm.dataLoaded, 'page-breaks': route.vm.filters.printPageBreaks}">
		<cmpt-ui-grid
			columns="route.vm.columns"
			dataset="route.vm.dataSet"
			track-by="id"
			default-row-height="66"
			default-sort="sortableDate"
		>
			{{route.vm.dataLoaded ? route.strings['NoRecordsFound'] : route.strings['Reports.Results.Label.InitialInstructions']}}.
		</cmpt-ui-grid>
	</div>
</div>

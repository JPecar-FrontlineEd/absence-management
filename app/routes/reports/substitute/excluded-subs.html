<div class="fixed-width report-standards route-reports-excluded-subs" ng-controller="ExcludedSubsCtrl as route">

	<cmpt-reports-switcher section="substitute"></cmpt-reports-switcher>

	<h3>{{route.strings['Reports.Title.ExcludedSubstitutes']}}</h3>
	<div class="panel">
		<cmpt-reports-filter-panel filters="route.vm.filters" action="route.go.search"></cmpt-reports-filter-panel>
	</div>

	<div id="report-lock-header" class="lock-header-fill"></div>
	<div class="header">
		<div class="header-content">
			<div class="count" ng-class="{loaded: route.vm.dataLoaded}">{{route.vm.distinctSubIds.length}}</div>
			<div class="label" ng-class="{loaded: route.vm.dataLoaded}">{{route.strings['Reports.Title.ExcludedSubstitutes']}}</div>
			<cmpt-ui-loader cls="report-loader" is-loading="route.vm.isLoading"></cmpt-ui-loader>
			<cmpt-ui-print-button></cmpt-ui-print-button>
		</div>
	</div>
	<div class="content-panel" ng-class="{loaded: route.vm.dataLoaded}">
		<cmpt-ui-grouped-grid
		  columns="route.vm.columns"
		  dataset="route.vm.dataSet"
		  group-by="'groupSort'"
		  group-title="'groupTitle'"
		  >
		  	{{route.vm.dataLoaded ? route.strings['NoRecordsFound'] : route.strings['Reports.Results.Label.InitialInstructions']}}.
		</cmpt-ui-grouped-grid>
	</div>

</div>

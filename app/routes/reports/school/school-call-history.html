<div class="fixed-width report-standards route-reports-school-call-history" ng-controller="SchoolCallHistoryCtrl as route">
	<cmpt-reports-switcher section="School"></cmpt-reports-switcher>
	<h3>{{route.strings['Reports.Title.SchoolCallHistory']}}</h3>
	<div class="panel">
		<cmpt-reports-filter-panel filters="route.vm.filters" extra-validators="route.vm.validation" action="route.go.search"></cmpt-reports-filter-panel>
	</div>

	<div id="report-lock-header" class="lock-header-fill"></div>
	<div class="header">
		<div class="header-content">
			<div class="count" ng-class="{loaded: route.vm.dataLoaded}">{{route.vm.dataSet.length}}</div>
			<div class="label" ng-class="{loaded: route.vm.dataLoaded}">{{route.strings['Reports.Title.SchoolCallHistory']}}</div>
			<cmpt-ui-loader cls="report-loader" is-loading="route.vm.isLoading"></cmpt-ui-loader>
			<cmpt-ui-print-button></cmpt-ui-print-button>
		</div>
	</div>
	<div class="content-panel" ng-class="{loaded: route.vm.dataLoaded}">
		<cmpt-ui-grouped-grid
		  columns="route.vm.columns"
		  footer-columns="route.vm.footerColumns"
		  dataset="route.vm.dataSet"
		  is-loaded="route.vm.dataLoaded"
		  group-by="'Institution'"
		  >{{route.vm.dataLoaded ? route.strings['NoRecordsFound'] : route.strings['Reports.Results.Label.InitialInstructions']}}.</cmpt-ui-grouped-grid>
	</div>
</div>

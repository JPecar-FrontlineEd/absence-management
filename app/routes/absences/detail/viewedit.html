<form name="myForm" novalidate>
<div class="route-absences-detail-view-edit" ng-controller="AbsenceViewEditCtrl as route">
	<div class="view-edit-processing" ng-show="route.vm.loading">
		<div class="processing">
		</div>
		<div class="text">{{ route.vm.message }}</div>
		<cmpt-ui-loader cls="loader" is-loading="true"></cmpt-ui-loader>
	</div>
	<div class="-g">
		<cmpt-absr-undelete-panel ng-if = "absrState.absr.isDeleted && route.vm.isOrgUser && route.vm.canUndeleteAbsence"></cmpt-absr-undelete-panel>
		<cmpt-absr-buttons class="top" is-loading="route.vm.loading" message="route.vm.message"></cmpt-absr-buttons>
		<cmpt-absr-error-banner ng-if = "selectedView == 'btnDay' && absrState.hasError" error-message="route.vm.errorMessage"></cmpt-absr-error-banner>
		<cmpt-absr-details-section class="-u-18-24" ng-if="selectedView == 'btnVariation'"></cmpt-absr-details-section>
		<cmpt-absr-details-section-by-day class="-u-18-24" ng-if="selectedView == 'btnDay'"></cmpt-absr-details-section-by-day>
		<div class="-u-6-24 right-side" ng-class="{deletedAbsrNextPanelBackground : absrState.absr.isDeleted}">
			<cmpt-absr-next-steps is-loading="route.vm.loading" message="route.vm.message"></cmpt-absr-next-steps>
		 	<cmpt-absr-details-summary-section review-mode="true"></cmpt-absr-details-summary-section>
		 </div>
		<cmpt-absr-buttons class="bottom" is-loading="route.vm.loading" message="route.vm.message"></cmpt-absr-buttons>
	</div>
</div>
</form>

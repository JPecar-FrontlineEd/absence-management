	<div class="filter-section">
		<cmpt-absr-available-substitutes-filter-panel  filter="vm.filter" show-qualified="vm.showQualifiedAndAvailable"></cmpt-absr-available-substitutes-filter-panel>

	<div class="results-section">
		<cmpt-absr-available-substitute-bottom-result filter="vm.filter" show-qualified="vm.showQualifiedAndAvailable"></cmpt-absr-available-substitute-bottom-result>

<div class="route-absences-detail-reconciliation" ng-controller="ReconciliationCtrl as route" ng-class="{'hide-reconcile-all': !route.vm.multipleAbsencesToReconcile}">
	<div class="top">
		<a class="fl-button {{ button.cls }}" ng-click="button.action()"  ng-repeat="button in route.vm.buttons">{{ route.strings[button.title] }}</a>
	</div>
	<div class="container">
		<div class="modal-spinner ng-hide" ng-show="route.vm.isProcessing"></div>
		<cmpt-ui-sortable-grid
		columns="route.vm.columns"
		dataset="route.vm.dataSet"
		track-by="id"
		actions="route.go"></cmpt-ui-sortable-grid>
	</div>
	<div class="bottom">
		<a class="fl-button {{ button.cls }}" ng-click="button.action()"  ng-repeat="button in route.vm.buttons">{{ route.strings[button.title] }}</a>
	</div>
</div>

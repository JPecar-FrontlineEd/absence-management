<div class="route-settings-school-details-school-excluded-substitutes" ng-controller="SchoolExcludedSubstitutesCtrl as route">
	<div class="section-heading clear">
		<div class="left-section">{{strings['InstSelector.Tab.Header.Text.ExcludedSubstitutes']}}</div>
		<div class="right-section">

		</div>
	</div>

	<div ng-if="!route.vm.canViewList">You do not have permission to view the excluded list.</div>

	<div ng-if="route.vm.canViewList">
		<div ng-show="!route.vm.showAddSubs">
			<div class="actions-header clear">
				<div class="substitute-actions" ng-if="route.vm.canEditList">
					<button class="fl-button"  ng-show="route.vm.removingSub">
	            		<i class="fa fa-spinner fa-spin"></i>{{strings['PreferredSub.Button.Text.RemovingSubstitutes']}}
	            	</button>
					<button class="fl-button fl-negative" ng-class="{'fl-disabled':route.vm.selected.length<1}" ng-if="route.vm.selected.length >= 1" ng-click="go.removeSelected()" ng-show="!route.vm.removingSub">
	            		<i class="fa fa-trash-o"></i>
	            		{{strings['PreferredSub.Button.Text.RemoveSelectedSubstitutes']}}
	            	</button>
	            	<button class="fl-button fl-positive" ng-class="{'fl-disabled':!route.vm.enableAddSubs}" ng-show="route.vm.enableAddSubs" ng-if="route.vm.canEditList" ng-click="go.AddSubs()">
	            		<i class="fa fa-plus"></i>
	            		{{strings['PreferredSub.Button.Text.AddSubstitutes']}}
	            	</button>
	            </div>
	        </div>

			<cmpt-call-group-excluded-list
	    		is-loading=route.vm.loadingPrefs
	    		data=route.vm.preferences
	    		selected=route.vm.selected
	    		editing=route.vm.prefEditing
	    		enabled=route.vm.enableExcludedList
	    	>{{strings['PreferredSub.Text.GetStartedByAddingSubstitutes']}}!</cmpt-call-group-excluded-list>

			<div class="actions-footer clear">
                <div class="substitute-actions right-section" ng-if="route.vm.canEditList">
                	<button class="fl-button"  ng-show="route.vm.removingSub">
	            		<i class="fa fa-spinner fa-spin"></i>{{strings['PreferredSub.Button.Text.RemovingSubstitutes']}}
	            	</button>
					<button class="fl-button fl-negative" ng-class="{'fl-disabled':route.vm.selected.length<1}" ng-if="route.vm.selected.length >= 1" ng-click="go.removeSelected()" ng-show="!route.vm.removingSub">
	            		<i class="fa fa-trash-o"></i>
	            		{{strings['PreferredSub.Button.Text.RemoveSelectedSubstitutes']}}
	            	</button>
	            	<button class="fl-button fl-positive" ng-class="{'fl-disabled':!route.vm.enableAddSubs}" ng-show="route.vm.enableAddSubs" ng-if="route.vm.canEditList"  ng-click="go.AddSubs()">
	            		<i class="fa fa-plus"></i>
	            		{{strings['PreferredSub.Button.Text.AddSubstitutes']}}
	            	</button>
                </div>
            </div>
		</div>

		<div class="add-subs" ng-show="route.vm.showAddSubs">
	        <cmpt-call-group-add-substitutes preferred-subs="false" adding-subs="route.vm.addingSubs" show="route.vm.showAddSubs" call-group-id="{{route.vm.callGroupId}}"></cmpt-call-group-add-substitutes>
	    </div>

	</div>
</div>

<div class="dialog-popup deny-part-popup">
	<div class="ngdialog-message">
		<div class="header">{{ ngDialogData.strings['Approval.DenyPart.Dialog.Header.Text'] }} #{{ ngDialogData.absr.id }}</div>
		<div class="content">
			<div class="approval-status">
				{{ ngDialogData.strings['Approval.Label.Text.ApprovalStatus'] }}
				<cmpt-template-approval requires-approval="true"
					is-approved="ngDialogData.absr.isApproved"
					is-denied="ngDialogData.absr.isDenied"
					is-partially-approved="ngDialogData.absr.isPartiallyApproved">
				</cmpt-template-approval>
			</div>
			<div class="absence-list">
				<cmpt-ui-multiselect-sortable-grid
					columns="ngDialogData.cols"
					dataset="ngDialogData.absr.absences"
					selected="ngDialogData.selectedAbsences"
				>
				</cmpt-ui-multiselect-sortable-grid>
			</div>

			<div class="comment-box">
				<span>{{ngDialogData.strings['Approval.Lablel.Text.Comments']}}</span>
				<cmpt-ui-textarea labeltext="ngDialogData.strings['EnterComment']" characters="255" text-model="ngDialogData.comments" read-only="false" error-messages="[]"></cmpt-ui-textarea>
			</div>

		</div>
	</div>
	<div class="ngdialog-buttons">
		<a class="{{ ngDialogData.denySelectedBtn.cls }}"
			ng-click="!ngDialogData.selectedAbsences.length > 0 || ngDialogData.denySelectedBtn.action()"
			ng-class="{'fl-disabled': !ngDialogData.selectedAbsences.length}"
		>
			<i class="fa {{ngDialogData.denySelectedBtn.loading ? 'fa-spinner fa-spin' : ngDialogData.denySelectedBtn.icon}}"></i>
			{{ ngDialogData.denySelectedBtn.title }}
		</a>

		<a class="{{ button.cls }}"
			ng-click="!button.enabled || button.action()"
			ng-repeat="button in ngDialogData.buttons"
			ng-class="{'fl-disabled': !button.enabled}"
		>
			<i class="fa {{button.loading ? 'fa-spinner fa-spin' : button.icon}}"></i>
			{{ button.title }}
		</a>
	</div>
</div>
